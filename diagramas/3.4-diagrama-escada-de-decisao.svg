<svg role="img" aria-label="Diagrama do item 3.4: A escada de decisão: quando agir" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">A escada de decisão: quando agir</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Na dúvida entre dois degraus, escolha o mais alto</text>

  <!-- seta de urgência -->
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#6b7280">quanto mais para a direita, menos se espera</text>
  <line x1="40" y1="116" x2="748" y2="116" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="748,109 760,116 748,123" fill="#9ca3af"/>

  <!-- degrau 1 -->
  <rect x="40" y="300" width="170" height="150" rx="8" fill="#dcfce7"/>
  <text x="125" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">1. Observe e ajuste</text>
  <text x="125" y="349" text-anchor="middle" font-size="11" fill="#14532d">incômodo leve e localizado,</text>
  <text x="125" y="366" text-anchor="middle" font-size="11" fill="#14532d">sem piorar no dia seguinte:</text>
  <text x="125" y="383" text-anchor="middle" font-size="11" fill="#14532d">reduza, ajuste, anote</text>
  <text x="125" y="400" text-anchor="middle" font-size="11" fill="#14532d">(amarelo do item 3.3)</text>
  <text x="125" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">dias a 2 semanas</text>

  <!-- degrau 2 -->
  <rect x="230" y="250" width="170" height="200" rx="8" fill="#fef9c3"/>
  <text x="315" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">2. Pause o exercício</text>
  <text x="315" y="299" text-anchor="middle" font-size="11" fill="#713f12">persiste por 1 a 2 semanas</text>
  <text x="315" y="316" text-anchor="middle" font-size="11" fill="#713f12">ou piora aos poucos:</text>
  <text x="315" y="333" text-anchor="middle" font-size="11" fill="#713f12">tire aquele exercício,</text>
  <text x="315" y="350" text-anchor="middle" font-size="11" fill="#713f12">treine o resto</text>
  <text x="315" y="367" text-anchor="middle" font-size="11" fill="#713f12">e reavalie em 48 h</text>
  <text x="315" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#713f12">se não melhora, suba</text>

  <!-- degrau 3 -->
  <rect x="420" y="200" width="170" height="250" rx="8" fill="#ffedd5"/>
  <text x="505" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">3. Procure avaliação</text>
  <text x="505" y="249" text-anchor="middle" font-size="11" fill="#7c2d12">dor em repouso ou à noite</text>
  <text x="505" y="266" text-anchor="middle" font-size="11" fill="#7c2d12">perda de força ou amplitude</text>
  <text x="505" y="283" text-anchor="middle" font-size="11" fill="#7c2d12">inchaço, calor, instabilidade</text>
  <text x="505" y="300" text-anchor="middle" font-size="11" fill="#7c2d12">dormência ou formigamento</text>
  <text x="505" y="317" text-anchor="middle" font-size="11" fill="#7c2d12">ou o degrau 2 não resolveu</text>
  <text x="505" y="350" text-anchor="middle" font-size="11" fill="#7c2d12">médico do esporte, ortopedista,</text>
  <text x="505" y="367" text-anchor="middle" font-size="11" fill="#7c2d12">fisioterapeuta</text>
  <text x="505" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">em poucos dias</text>

  <!-- degrau 4 -->
  <rect x="610" y="150" width="150" height="300" rx="8" fill="#fee2e2"/>
  <text x="685" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">4. Atenção imediata</text>
  <text x="685" y="199" text-anchor="middle" font-size="11" fill="#7f1d1d">dor súbita com estalo</text>
  <text x="685" y="216" text-anchor="middle" font-size="11" fill="#7f1d1d">não apoia ou não move</text>
  <text x="685" y="233" text-anchor="middle" font-size="11" fill="#7f1d1d">deformidade ou inchaço</text>
  <text x="685" y="250" text-anchor="middle" font-size="11" fill="#7f1d1d">rápido</text>
  <text x="685" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">durante o esforço:</text>
  <text x="685" y="292" text-anchor="middle" font-size="11" fill="#7f1d1d">dor no peito, falta de ar,</text>
  <text x="685" y="309" text-anchor="middle" font-size="11" fill="#7f1d1d">tontura ou desmaio</text>
  <text x="685" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">dias após treino pesado:</text>
  <text x="685" y="351" text-anchor="middle" font-size="11" fill="#7f1d1d">dor muscular extrema</text>
  <text x="685" y="368" text-anchor="middle" font-size="11" fill="#7f1d1d">e urina muito escura</text>
  <text x="685" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">hoje, sem esperar</text>

  <!-- causas comuns -->
  <text x="400" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">O que costuma estar por trás, e onde já vimos</text>

  <rect x="40" y="492" width="136" height="50" rx="8" fill="#f3f4f6"/>
  <text x="108" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Salto de carga</text>
  <text x="108" y="530" text-anchor="middle" font-size="11" fill="#4b5563">(item 3.2)</text>

  <rect x="186" y="492" width="136" height="50" rx="8" fill="#f3f4f6"/>
  <text x="254" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Volume além do MRV</text>
  <text x="254" y="530" text-anchor="middle" font-size="11" fill="#4b5563">(item 1.3)</text>

  <rect x="332" y="492" width="136" height="50" rx="8" fill="#f3f4f6"/>
  <text x="400" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Sono e proteína curtos</text>
  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#4b5563">(item 1.5)</text>

  <rect x="478" y="492" width="136" height="50" rx="8" fill="#f3f4f6"/>
  <text x="546" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Técnica que degrada</text>
  <text x="546" y="530" text-anchor="middle" font-size="11" fill="#4b5563">(item 2.3)</text>

  <rect x="624" y="492" width="136" height="50" rx="8" fill="#f3f4f6"/>
  <text x="692" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Pular o aquecimento</text>
  <text x="692" y="530" text-anchor="middle" font-size="11" fill="#4b5563">(item 3.1)</text>

  <!-- rodapé -->
  <rect x="40" y="560" width="720" height="56" rx="8" fill="#fef9c3"/>
  <text x="400" y="582" text-anchor="middle" font-size="13" fill="#713f12">Lesão por sobrecarga costuma avisar: rachaduras finas aparecem antes do desabamento.</text>
  <text x="400" y="602" text-anchor="middle" font-size="13" fill="#713f12">Este guia não substitui avaliação profissional: na dúvida, procure.</text>
</svg>
