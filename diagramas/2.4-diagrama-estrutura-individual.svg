<svg role="img" aria-label="Diagrama do item 2.4: Mesmo exercício, corpos diferentes" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Mesmo exercício, corpos diferentes</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Fundo do agachamento, vista de lado (ilustração esquemática)</text>

  <!-- painel A -->
  <rect x="40" y="80" width="350" height="290" rx="10" fill="#eff6ff"/>
  <text x="215" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Fêmur longo, tronco mais curto</text>
  <g transform="translate(60,36)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- pé -->
    <line x1="75" y1="285" x2="125" y2="285" stroke="#374151" stroke-width="6"/>
    <!-- canela -->
    <line x1="90" y1="285" x2="165" y2="235" stroke="#2563eb" stroke-width="7"/>
    <!-- coxa -->
    <line x1="165" y1="235" x2="80" y2="230" stroke="#2563eb" stroke-width="7"/>
    <!-- tronco -->
    <line x1="80" y1="230" x2="155" y2="160" stroke="#1d4ed8" stroke-width="7"/>
    <!-- cabeça -->
    <circle cx="172" cy="142" r="12" stroke="#1d4ed8" stroke-width="4"/>
    <!-- barra -->
    <circle cx="150" cy="156" r="6" fill="#111827" stroke="none"/>
    <!-- vertical de referência -->
    <line x1="80" y1="130" x2="80" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  <text x="215" y="355" text-anchor="middle" font-size="13" fill="#1e3a8a">Mais inclinação do tronco: normal</text>

  <!-- painel B -->
  <rect x="410" y="80" width="350" height="290" rx="10" fill="#f0fdf4"/>
  <text x="585" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">Fêmur curto, tronco mais longo</text>
  <g transform="translate(430,36)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="75" y1="285" x2="125" y2="285" stroke="#374151" stroke-width="6"/>
    <line x1="90" y1="285" x2="155" y2="240" stroke="#16a34a" stroke-width="7"/>
    <line x1="155" y1="240" x2="92" y2="232" stroke="#16a34a" stroke-width="7"/>
    <line x1="92" y1="232" x2="110" y2="130" stroke="#15803d" stroke-width="7"/>
    <circle cx="112" cy="112" r="12" stroke="#15803d" stroke-width="4"/>
    <circle cx="108" cy="134" r="6" fill="#111827" stroke="none"/>
    <line x1="92" y1="100" x2="92" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
  <text x="585" y="355" text-anchor="middle" font-size="13" fill="#14532d">Tronco mais vertical: também normal</text>

  <text x="400" y="400" text-anchor="middle" font-size="14" fill="#374151">Nenhum dos dois está errado: é a gangorra de proporções de cada esqueleto.</text>

  <!-- método -->
  <text x="400" y="438" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">Como achar a sua versão: mude uma coisa por vez</text>

  <rect x="40" y="455" width="170" height="86" rx="8" fill="#f3f4f6"/>
  <text x="125" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">1. Uma variável</text>
  <text x="125" y="498" text-anchor="middle" font-size="11" fill="#4b5563">pés, pegada, cotovelos,</text>
  <text x="125" y="513" text-anchor="middle" font-size="11" fill="#4b5563">barra, halter ou máquina</text>

  <rect x="225" y="455" width="170" height="86" rx="8" fill="#f3f4f6"/>
  <text x="310" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">2. Carga leve</text>
  <text x="310" y="498" text-anchor="middle" font-size="11" fill="#4b5563">peso alto esconde</text>
  <text x="310" y="513" text-anchor="middle" font-size="11" fill="#4b5563">o desconforto</text>

  <rect x="410" y="455" width="170" height="86" rx="8" fill="#f3f4f6"/>
  <text x="495" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">3. Quatro perguntas</text>
  <text x="495" y="498" text-anchor="middle" font-size="11" fill="#4b5563">sinto no músculo certo?</text>
  <text x="495" y="513" text-anchor="middle" font-size="11" fill="#4b5563">controle? sem dor? estável?</text>

  <rect x="595" y="455" width="165" height="86" rx="8" fill="#dcfce7"/>
  <text x="677" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">4. Fique com a que passa</text>
  <text x="677" y="498" text-anchor="middle" font-size="11" fill="#166534">nenhuma passou?</text>
  <text x="677" y="513" text-anchor="middle" font-size="11" fill="#166534">troque o exercício</text>

  <polygon points="209,492 221,498 209,504" fill="#9ca3af"/>
  <polygon points="394,492 406,498 394,504" fill="#9ca3af"/>
  <polygon points="579,492 591,498 579,504" fill="#9ca3af"/>

  <!-- rodapé -->
  <rect x="40" y="562" width="720" height="56" rx="8" fill="#fef9c3"/>
  <text x="400" y="585" text-anchor="middle" font-size="13" fill="#713f12">Mobilidade se treina; estrutura óssea não: ela pede ajuste de posição ou troca de variação.</text>
  <text x="400" y="604" text-anchor="middle" font-size="13" fill="#713f12">Trocar de exercício é decisão técnica, não fracasso. Dor persistente: avaliação profissional.</text>
</svg>
