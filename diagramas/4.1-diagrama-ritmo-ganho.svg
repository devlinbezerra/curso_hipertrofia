<svg role="img" aria-label="Diagrama do item 4.1: A obra tem limite de velocidade: para onde vai o peso ganho" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">A obra tem limite de velocidade</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Para onde vai o peso ganho (esquema, sem escala real)</text>

  <!-- Painel 1: para onde vai o peso -->
  <rect x="40" y="80" width="720" height="250" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Mesmo canteiro, três ritmos de entrega de comida</text>

  <!-- Linha 1: lento -->
  <text x="55" y="146" font-size="14" font-weight="bold" fill="#1f2937">Lento</text>
  <text x="55" y="164" font-size="12" fill="#4b5563">~0,25% por semana</text>
  <rect x="210" y="132" width="130" height="36" fill="#1d4ed8"/>
  <rect x="340" y="132" width="35" height="36" fill="#f59e0b"/>
  <rect x="375" y="132" width="35" height="36" fill="#9ca3af"/>

  <!-- Linha 2: moderado -->
  <text x="55" y="201" font-size="14" font-weight="bold" fill="#1f2937">Moderado</text>
  <text x="55" y="219" font-size="12" fill="#4b5563">~0,5% por semana</text>
  <rect x="210" y="187" width="165" height="36" fill="#1d4ed8"/>
  <rect x="375" y="187" width="100" height="36" fill="#f59e0b"/>
  <rect x="475" y="187" width="55" height="36" fill="#9ca3af"/>

  <!-- Linha 3: rapido -->
  <text x="55" y="256" font-size="14" font-weight="bold" fill="#1f2937">Rápido demais</text>
  <text x="55" y="274" font-size="12" fill="#4b5563">~1% por semana</text>
  <rect x="210" y="242" width="190" height="36" fill="#1d4ed8"/>
  <rect x="400" y="242" width="230" height="36" fill="#f59e0b"/>
  <rect x="630" y="242" width="60" height="36" fill="#9ca3af"/>

  <!-- Legenda -->
  <rect x="60" y="296" width="14" height="14" fill="#1d4ed8"/>
  <text x="82" y="308" font-size="13" fill="#374151">músculo</text>
  <rect x="180" y="296" width="14" height="14" fill="#f59e0b"/>
  <text x="202" y="308" font-size="13" fill="#374151">gordura</text>
  <rect x="300" y="296" width="14" height="14" fill="#9ca3af"/>
  <text x="322" y="308" font-size="13" fill="#374151">água, glicogênio e comida em trânsito</text>

  <!-- Painel 2: teto de construcao -->
  <rect x="40" y="350" width="720" height="235" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">O teto de construção do músculo cai com os anos de treino</text>
  <text x="400" y="396" text-anchor="middle" font-size="12" fill="#4b5563">Barras azuis: quanto a obra consegue assentar. Linha vermelha: o mesmo excedente de comida.</text>

  <!-- linha do excedente -->
  <line x1="90" y1="430" x2="710" y2="430" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="710" y="422" text-anchor="end" font-size="12" font-weight="bold" fill="#dc2626">mesma comida entregue</text>

  <!-- linha de base -->
  <line x1="90" y1="540" x2="710" y2="540" stroke="#374151" stroke-width="2"/>

  <!-- barras -->
  <rect x="150" y="440" width="90" height="100" fill="#1d4ed8"/>
  <rect x="330" y="480" width="90" height="60" fill="#1d4ed8"/>
  <rect x="510" y="510" width="90" height="30" fill="#1d4ed8"/>

  <!-- sobras -->
  <text x="375" y="460" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">sobra</text>
  <text x="555" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">sobra maior</text>
  <text x="555" y="488" text-anchor="middle" font-size="12" fill="#92400e">vai para o depósito</text>

  <!-- rotulos -->
  <text x="195" y="562" text-anchor="middle" font-size="13" fill="#1f2937">Primeiro ano</text>
  <text x="375" y="562" text-anchor="middle" font-size="13" fill="#1f2937">Alguns anos</text>
  <text x="555" y="562" text-anchor="middle" font-size="13" fill="#1f2937">Muitos anos</text>
</svg>
