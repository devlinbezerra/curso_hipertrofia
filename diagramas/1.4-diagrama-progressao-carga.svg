<svg role="img" aria-label="Diagrama do item 1.4: Sem progressão o corpo estaciona; com degraus, continua se adaptando" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Progressão de carga: o corpo só se adapta ao que ainda é novidade</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Esquema ilustrativo</text>

  <!-- Painel esquerdo -->
  <rect x="30" y="75" width="400" height="320" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="230" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">SEM progressão: mesmo treino sempre</text>
  <line x1="60" y1="360" x2="410" y2="360" stroke="#374151" stroke-width="2"/>
  <line x1="60" y1="120" x2="60" y2="360" stroke="#374151" stroke-width="2"/>
  <text x="235" y="382" text-anchor="middle" font-size="12" fill="#4b5563">Tempo (semanas e meses) →</text>
  <!-- exigência fixa -->
  <line x1="60" y1="200" x2="410" y2="200" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- capacidade -->
  <path d="M60 335 C140 305 200 235 260 208 C300 200 360 200 410 200" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">exigência do treino (fixa)</text>
  <text x="140" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">capacidade do músculo</text>
  <text x="330" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Platô: o treino virou</text>
  <text x="330" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">rotina, não há novidade</text>
  <text x="330" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">para a fibra "responder"</text>

  <!-- Painel direito -->
  <rect x="470" y="75" width="400" height="320" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="670" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">COM progressão: a exigência sobe em degraus</text>
  <line x1="500" y1="360" x2="850" y2="360" stroke="#374151" stroke-width="2"/>
  <line x1="500" y1="120" x2="500" y2="360" stroke="#374151" stroke-width="2"/>
  <text x="675" y="382" text-anchor="middle" font-size="12" fill="#4b5563">Tempo (semanas e meses) →</text>
  <!-- degraus -->
  <path d="M500 300 H580 V250 H660 V200 H740 V150 H850" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 6"/>
  <!-- capacidade -->
  <path d="M500 335 C550 318 570 290 600 272 C640 252 665 232 700 217 C735 195 765 178 800 162 C822 154 838 150 850 148" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <text x="560" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">exigência sobe</text>
  <text x="560" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">um degrau de cada vez</text>
  <text x="770" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">capacidade acompanha</text>
  <text x="770" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">e continua crescendo</text>

  <!-- Formas de progredir -->
  <rect x="30" y="415" width="840" height="125" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="442" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Formas de subir o degrau (todas valem, desde que a execução se mantenha limpa)</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="130" y="476" font-weight="bold">+ Carga</text>
    <text x="130" y="494">mais peso na barra</text>
    <text x="340" y="476" font-weight="bold">+ Repetições</text>
    <text x="340" y="494">com o mesmo peso</text>
    <text x="560" y="476" font-weight="bold">+ Séries</text>
    <text x="560" y="494">(dentro do volume, item 1.3)</text>
    <text x="770" y="476" font-weight="bold">+ Qualidade</text>
    <text x="770" y="494">amplitude e controle</text>
  </g>
  <text x="450" y="525" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">O objetivo é manter a tensão sobre o músculo alta e perto do limite (item 1.2), com cargas cada vez maiores.</text>
</svg>
