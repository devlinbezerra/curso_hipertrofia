<svg role="img" aria-label="Diagrama do item 4.3: A régua da energia: onde a recomposição se encaixa" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">A régua da energia</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Onde a recomposição se encaixa (esquema, sem escala real)</text>

  <!-- Painel 1 -->
  <rect x="40" y="80" width="720" height="300" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Zonas -->
  <rect x="60" y="100" width="210" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Cutting</text>
  <text x="165" y="141" text-anchor="middle" font-size="12" fill="#991b1b">come menos do que gasta</text>

  <rect x="295" y="100" width="210" height="52" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="400" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Recomposição</text>
  <text x="400" y="141" text-anchor="middle" font-size="12" fill="#14532d">perto da manutenção</text>

  <rect x="530" y="100" width="210" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="635" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">Bulking</text>
  <text x="635" y="141" text-anchor="middle" font-size="12" fill="#78350f">come mais do que gasta</text>

  <!-- Músculo -->
  <text x="165" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Músculo</text>
  <text x="165" y="209" text-anchor="middle" font-size="13" fill="#1f2937">mantém, se estiver protegido</text>
  <text x="400" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Músculo</text>
  <text x="400" y="209" text-anchor="middle" font-size="13" fill="#1f2937">ganha devagar</text>
  <text x="635" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">Músculo</text>
  <text x="635" y="209" text-anchor="middle" font-size="13" fill="#1f2937">ganha mais rápido</text>

  <!-- Gordura -->
  <text x="165" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Gordura</text>
  <text x="165" y="269" text-anchor="middle" font-size="13" fill="#1f2937">perde mais rápido</text>
  <text x="400" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Gordura</text>
  <text x="400" y="269" text-anchor="middle" font-size="13" fill="#1f2937">perde devagar</text>
  <text x="635" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">Gordura</text>
  <text x="635" y="269" text-anchor="middle" font-size="13" fill="#1f2937">tende a acumular</text>

  <!-- Seta de energia -->
  <line x1="70" y1="315" x2="730" y2="315" stroke="#6b7280" stroke-width="2"/>
  <polygon points="730,309 742,315 730,321" fill="#6b7280"/>
  <polygon points="70,309 58,315 70,321" fill="#6b7280"/>
  <text x="70" y="340" font-size="12" fill="#4b5563">menos energia</text>
  <text x="730" y="340" text-anchor="end" font-size="12" fill="#4b5563">mais energia</text>
  <text x="400" y="364" text-anchor="middle" font-size="12" fill="#4b5563">Quanto mais comida, mais músculo, mas também mais gordura.</text>

  <!-- Painel 2 -->
  <rect x="40" y="400" width="720" height="185" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Quem tem mais chance de recompor</text>

  <rect x="60" y="440" width="110" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="115" y="464" text-anchor="middle" font-size="13" fill="#14532d">Iniciante</text>
  <rect x="182" y="440" width="170" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="267" y="464" text-anchor="middle" font-size="13" fill="#14532d">Retomada após pausa</text>
  <rect x="364" y="440" width="185" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="456" y="464" text-anchor="middle" font-size="13" fill="#14532d">Muita gordura a perder</text>
  <rect x="561" y="440" width="175" height="38" rx="19" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="648" y="464" text-anchor="middle" font-size="13" fill="#14532d">Treino não otimizado</text>

  <text x="400" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Menos chance</text>
  <rect x="60" y="524" width="345" height="38" rx="19" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="232" y="548" text-anchor="middle" font-size="13" fill="#374151">Muitos anos de treino e pouca gordura</text>
  <text x="425" y="548" font-size="13" fill="#374151">Fases separadas tendem a render mais.</text>
</svg>
