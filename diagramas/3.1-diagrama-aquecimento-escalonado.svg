<svg role="img" aria-label="Diagrama do item 3.1: Ligando a obra: as três camadas do aquecimento" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Ligando a obra: as três camadas do aquecimento</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Do corpo morno até a carga de trabalho, sem gastar a energia da série que importa</text>

  <!-- três camadas -->
  <rect x="40" y="80" width="230" height="110" rx="10" fill="#eff6ff"/>
  <text x="155" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">1. Aquecimento geral</text>
  <text x="155" y="126" text-anchor="middle" font-size="12" fill="#1e3a8a">3 a 5 min de atividade leve</text>
  <text x="155" y="143" text-anchor="middle" font-size="12" fill="#1e3a8a">corpo morno, leve suor,</text>
  <text x="155" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a">sem chegar a cansar</text>
  <text x="155" y="178" text-anchor="middle" font-size="11" fill="#4b5563">(esquenta a maquinaria)</text>

  <rect x="285" y="80" width="230" height="110" rx="10" fill="#f0fdf4"/>
  <text x="400" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">2. Mobilidade específica</text>
  <text x="400" y="126" text-anchor="middle" font-size="12" fill="#14532d">1 a 2 min, em movimento</text>
  <text x="400" y="143" text-anchor="middle" font-size="12" fill="#14532d">nas articulações do dia,</text>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#14532d">sem alongar parado</text>
  <text x="400" y="178" text-anchor="middle" font-size="11" fill="#4b5563">(percorre o trajeto)</text>

  <rect x="530" y="80" width="230" height="110" rx="10" fill="#fef9c3"/>
  <text x="645" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">3. Séries escalonadas</text>
  <text x="645" y="126" text-anchor="middle" font-size="12" fill="#713f12">séries leves do próprio</text>
  <text x="645" y="143" text-anchor="middle" font-size="12" fill="#713f12">exercício, subindo o peso</text>
  <text x="645" y="160" text-anchor="middle" font-size="12" fill="#713f12">até a carga de trabalho</text>
  <text x="645" y="178" text-anchor="middle" font-size="11" fill="#4b5563">(ensaia a ordem de serviço)</text>

  <polygon points="272,130 283,136 272,142" fill="#9ca3af"/>
  <polygon points="517,130 528,136 517,142" fill="#9ca3af"/>

  <!-- gráfico -->
  <rect x="40" y="210" width="720" height="258" rx="10" fill="#f9fafb"/>
  <text x="400" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Exemplo da camada 3: série de trabalho de 100 kg × 8 (números ilustrativos)</text>

  <line x1="80" y1="420" x2="545" y2="420" stroke="#9ca3af" stroke-width="1.5"/>

  <rect x="100" y="368" width="90" height="52" rx="4" fill="#bfdbfe"/>
  <text x="145" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">40 kg</text>
  <text x="145" y="437" text-anchor="middle" font-size="11" fill="#374151">Aquec. 1</text>
  <text x="145" y="452" text-anchor="middle" font-size="11" fill="#374151">8 a 10 reps</text>

  <rect x="215" y="342" width="90" height="78" rx="4" fill="#93c5fd"/>
  <text x="260" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">60 kg</text>
  <text x="260" y="437" text-anchor="middle" font-size="11" fill="#374151">Aquec. 2</text>
  <text x="260" y="452" text-anchor="middle" font-size="11" fill="#374151">5 reps</text>

  <rect x="330" y="316" width="90" height="104" rx="4" fill="#60a5fa"/>
  <text x="375" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">80 kg</text>
  <text x="375" y="437" text-anchor="middle" font-size="11" fill="#374151">Aquec. 3</text>
  <text x="375" y="452" text-anchor="middle" font-size="11" fill="#374151">2 a 3 reps</text>

  <rect x="445" y="290" width="90" height="130" rx="4" fill="#16a34a"/>
  <text x="490" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">100 kg</text>
  <text x="490" y="437" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Trabalho</text>
  <text x="490" y="452" text-anchor="middle" font-size="11" fill="#166534">8 reps, perto do limite</text>

  <text x="650" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Nas séries de aquecimento:</text>
  <text x="650" y="296" text-anchor="middle" font-size="12" fill="#374151">longe da falha</text>
  <text x="650" y="318" text-anchor="middle" font-size="12" fill="#374151">repetições caem</text>
  <text x="650" y="335" text-anchor="middle" font-size="12" fill="#374151">quando o peso sobe</text>
  <text x="650" y="357" text-anchor="middle" font-size="12" fill="#374151">descanso curto</text>
  <text x="650" y="374" text-anchor="middle" font-size="12" fill="#374151">(30 a 90 segundos)</text>
  <text x="650" y="396" text-anchor="middle" font-size="12" fill="#374151">não contam no volume</text>
  <text x="650" y="413" text-anchor="middle" font-size="12" fill="#374151">semanal (item 1.3)</text>

  <!-- faça / evite -->
  <rect x="40" y="484" width="350" height="92" rx="8" fill="#f0fdf4"/>
  <text x="215" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Faça</text>
  <text x="215" y="526" text-anchor="middle" font-size="12" fill="#14532d">Ensaie a técnica nas séries leves (item 2.3)</text>
  <text x="215" y="544" text-anchor="middle" font-size="12" fill="#14532d">Observe como o corpo amanheceu hoje</text>
  <text x="215" y="562" text-anchor="middle" font-size="12" fill="#14532d">Nos exercícios seguintes, 1 série leve basta</text>

  <rect x="410" y="484" width="350" height="92" rx="8" fill="#fef2f2"/>
  <text x="585" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Evite</text>
  <text x="585" y="526" text-anchor="middle" font-size="12" fill="#7f1d1d">Pular direto para a carga pesada</text>
  <text x="585" y="544" text-anchor="middle" font-size="12" fill="#7f1d1d">Aquecer até cansar (gasta a energia do treino)</text>
  <text x="585" y="562" text-anchor="middle" font-size="12" fill="#7f1d1d">Alongamento parado e longo antes da carga</text>

  <!-- rodapé -->
  <rect x="40" y="590" width="720" height="44" rx="8" fill="#fef9c3"/>
  <text x="400" y="609" text-anchor="middle" font-size="13" fill="#713f12">Aquecer é ligar a obra e ensaiar a ordem de serviço antes de chamar a equipe pesada.</text>
  <text x="400" y="626" text-anchor="middle" font-size="13" fill="#713f12">Dor que não passa com o aquecimento é informação: itens 3.3 e 3.4.</text>
</svg>
