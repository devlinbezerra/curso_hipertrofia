<svg role="img" aria-label="Diagrama do item 1.3: A curva do volume: MV, MEV, MAV e MRV" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Volume semanal: a curva do "nem pouco, nem demais"</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Esquema ilustrativo: a forma da curva é real, os pontos exatos variam de pessoa para pessoa e de músculo para músculo</text>

  <!-- Zona MAV sombreada -->
  <rect x="430" y="80" width="190" height="320" fill="#d1fae5" opacity="0.7"/>
  <text x="525" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">MAV</text>
  <text x="525" y="114" text-anchor="middle" font-size="11" fill="#065f46">zona de melhor retorno</text>

  <!-- Zona acima do MRV -->
  <rect x="700" y="80" width="160" height="320" fill="#fee2e2" opacity="0.7"/>
  <text x="780" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Passou do MRV:</text>
  <text x="780" y="114" text-anchor="middle" font-size="12" fill="#991b1b">recuperação não dá conta</text>

  <!-- Eixos -->
  <line x1="80" y1="400" x2="870" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="70" x2="80" y2="400" stroke="#374151" stroke-width="2"/>
  <text x="475" y="440" text-anchor="middle" font-size="13" fill="#1f2937">Séries duras por grupo muscular por semana →</text>
  <text x="30" y="235" text-anchor="middle" font-size="13" fill="#1f2937" transform="rotate(-90 30 235)">Resultado (ganho de músculo) →</text>

  <!-- Linha de zero (manutenção) -->
  <line x1="80" y1="300" x2="870" y2="300" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="862" y="294" text-anchor="end" font-size="11" fill="#6b7280">acima = ganha | abaixo = perde</text>

  <!-- Curva -->
  <path d="M100 385 C150 370 170 320 190 300 C260 230 330 150 430 122 C500 105 560 105 610 125 C680 155 740 260 840 385"
        fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>

  <!-- Marcadores verticais -->
  <g stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="190" y1="300" x2="190" y2="400"/>
    <line x1="280" y1="205" x2="280" y2="400"/>
    <line x1="700" y1="190" x2="700" y2="400"/>
  </g>

  <!-- Rótulos abaixo do eixo -->
  <text x="190" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">MV</text>
  <text x="280" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">MEV</text>
  <text x="525" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">MAV</text>
  <text x="700" y="422" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">MRV</text>

  <!-- Legenda -->
  <g font-size="13" fill="#1f2937">
    <text x="80" y="462"><tspan font-weight="bold">MV</tspan> (volume de manutenção): o mínimo para não perder o que já construiu.</text>
    <text x="80" y="484"><tspan font-weight="bold">MEV</tspan> (volume mínimo efetivo): onde o crescimento passa a valer a pena.</text>
    <text x="80" y="506"><tspan font-weight="bold">MAV</tspan> (volume adaptativo máximo): a faixa onde você cresce melhor.</text>
    <text x="80" y="528"><tspan font-weight="bold">MRV</tspan> (volume máximo recuperável): o teto; acima disso a demolição ganha da obra.</text>
  </g>
</svg>
