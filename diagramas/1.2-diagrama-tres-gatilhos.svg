<svg role="img" aria-label="Diagrama do item 1.2: Os três gatilhos convergem para a mesma ordem de serviço" viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Os 3 gatilhos: o que o treino "diz" à fibra muscular</text>

  <!-- Card 1 -->
  <rect x="20" y="60" width="270" height="300" rx="12" fill="#fde8e8" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="155" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#991b1b">1. Tensão mecânica</text>
  <text x="155" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">O GATILHO PRINCIPAL</text>
  <!-- haltere/corda esticada -->
  <line x1="60" y1="170" x2="250" y2="170" stroke="#7f1d1d" stroke-width="10" stroke-linecap="round"/>
  <rect x="40" y="145" width="22" height="50" rx="4" fill="#374151"/>
  <rect x="248" y="145" width="22" height="50" rx="4" fill="#374151"/>
  <text x="155" y="150" text-anchor="middle" font-size="22" fill="#991b1b">← →</text>
  <text x="155" y="225" text-anchor="middle" font-size="13" fill="#1f2937">A fibra é esticada e puxada</text>
  <text x="155" y="245" text-anchor="middle" font-size="13" fill="#1f2937">com força: os "remadores"</text>
  <text x="155" y="265" text-anchor="middle" font-size="13" fill="#1f2937">fazem esforço de verdade.</text>
  <text x="155" y="300" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">Analogia: o sensor de peso</text>
  <text x="155" y="318" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">de um elevador.</text>
  <text x="155" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Evidência: forte</text>

  <!-- Card 2 -->
  <rect x="315" y="60" width="270" height="300" rx="12" fill="#fff4e5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="450" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a3412">2. Dano muscular</text>
  <text x="450" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">COADJUVANTE (NÃO É META)</text>
  <!-- corda esfiapada -->
  <line x1="355" y1="170" x2="420" y2="170" stroke="#9a3412" stroke-width="8" stroke-linecap="round"/>
  <line x1="480" y1="170" x2="545" y2="170" stroke="#9a3412" stroke-width="8" stroke-linecap="round"/>
  <path d="M420 170 l12 -10 l8 12 l10 -14 l10 12 l12 -6 l8 6" fill="none" stroke="#ea580c" stroke-width="3"/>
  <path d="M420 170 l12 10 l8 -10 l10 14 l10 -10 l12 6 l8 -4" fill="none" stroke="#ea580c" stroke-width="3"/>
  <text x="450" y="225" text-anchor="middle" font-size="13" fill="#1f2937">Microrrupturas na estrutura</text>
  <text x="450" y="245" text-anchor="middle" font-size="13" fill="#1f2937">da fibra. Gera dor depois,</text>
  <text x="450" y="265" text-anchor="middle" font-size="13" fill="#1f2937">mas não mede a qualidade do treino.</text>
  <text x="450" y="300" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">Analogia: fios esfiapados</text>
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">da corda que a obra precisa remendar.</text>
  <text x="450" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">Evidência: moderada/incerta</text>

  <!-- Card 3 -->
  <rect x="610" y="60" width="270" height="300" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="745" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">3. Estresse metabólico</text>
  <text x="745" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#047857">A SENSAÇÃO DO "BURN" / PUMP</text>
  <!-- esponja/gotas -->
  <rect x="690" y="135" width="110" height="60" rx="14" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <g fill="#0ea5e9">
    <circle cx="715" cy="165" r="6"/><circle cx="745" cy="155" r="6"/><circle cx="775" cy="170" r="6"/>
    <circle cx="730" cy="182" r="5"/><circle cx="762" cy="185" r="5"/>
  </g>
  <text x="745" y="225" text-anchor="middle" font-size="13" fill="#1f2937">Acúmulo de resíduos e líquido</text>
  <text x="745" y="245" text-anchor="middle" font-size="13" fill="#1f2937">dentro da fibra: ardência e</text>
  <text x="745" y="265" text-anchor="middle" font-size="13" fill="#1f2937">"inchaço" de esforço repetido.</text>
  <text x="745" y="300" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">Analogia: esponja que</text>
  <text x="745" y="318" text-anchor="middle" font-size="12" fill="#4b5563" font-style="italic">enche e "sinaliza" esforço.</text>
  <text x="745" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">Evidência: fraca/indireta</text>

  <!-- Funil -->
  <path d="M155 360 L155 395 M450 360 L450 395 M745 360 L745 395" stroke="#6b7280" stroke-width="3"/>
  <path d="M60 395 H840 L520 450 H380 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Sensores dentro da fibra</text>
  <text x="450" y="475" text-anchor="middle" font-size="26" fill="#6b7280">↓</text>
  <rect x="280" y="485" width="340" height="40" rx="10" fill="#1f2937"/>
  <text x="450" y="511" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ORDEM DE SERVIÇO: "construir mais estrutura"</text>
</svg>
