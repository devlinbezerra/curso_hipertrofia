<svg role="img" aria-label="Diagrama do item 4.2: O canteiro sem verba: de onde sai o peso perdido e as três proteções" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">O canteiro sem verba</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">De onde sai o peso perdido (esquema, sem escala real)</text>

  <!-- Painel 1 -->
  <rect x="40" y="80" width="720" height="205" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Mesma perda de peso na balança, origem diferente</text>

  <!-- Linha 1: moderado -->
  <text x="55" y="152" font-size="14" font-weight="bold" fill="#1f2937">Déficit moderado</text>
  <text x="55" y="170" font-size="12" fill="#4b5563">~0,5 a 0,7% por semana</text>
  <rect x="230" y="136" width="405" height="36" fill="#f59e0b"/>
  <rect x="635" y="136" width="45" height="36" fill="#1d4ed8"/>

  <!-- Linha 2: agressivo -->
  <text x="55" y="207" font-size="14" font-weight="bold" fill="#1f2937">Déficit agressivo</text>
  <text x="55" y="225" font-size="12" fill="#4b5563">acima de ~1% por semana</text>
  <rect x="230" y="191" width="315" height="36" fill="#f59e0b"/>
  <rect x="545" y="191" width="135" height="36" fill="#1d4ed8"/>

  <!-- Legenda -->
  <rect x="60" y="252" width="14" height="14" fill="#f59e0b"/>
  <text x="82" y="264" font-size="13" fill="#374151">gordura (o depósito)</text>
  <rect x="260" y="252" width="14" height="14" fill="#1d4ed8"/>
  <text x="282" y="264" font-size="13" fill="#374151">músculo (a parede da obra)</text>

  <!-- Painel 2 -->
  <rect x="40" y="305" width="720" height="280" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="331" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Três proteções do músculo durante o déficit</text>

  <!-- Caixa 1 -->
  <rect x="55" y="348" width="220" height="140" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="165" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Treino pesado</text>
  <text x="165" y="399" text-anchor="middle" font-size="13" font-style="italic" fill="#1e3a8a">a ordem de serviço</text>
  <text x="165" y="431" text-anchor="middle" font-size="13" fill="#1f2937">Manter a carga nas barras</text>
  <text x="165" y="451" text-anchor="middle" font-size="13" fill="#1f2937">e as séries duras</text>
  <text x="165" y="471" text-anchor="middle" font-size="13" fill="#1f2937">(não treinar só "leve")</text>

  <!-- Caixa 2 -->
  <rect x="290" y="348" width="220" height="140" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="400" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">Proteína alta</text>
  <text x="400" y="399" text-anchor="middle" font-size="13" font-style="italic" fill="#14532d">o material da obra</text>
  <text x="400" y="431" text-anchor="middle" font-size="13" fill="#1f2937">Parte alta da faixa</text>
  <text x="400" y="451" text-anchor="middle" font-size="13" fill="#1f2937">do item 1.5; também</text>
  <text x="400" y="471" text-anchor="middle" font-size="13" fill="#1f2937">ajuda a saciar</text>

  <!-- Caixa 3 -->
  <rect x="525" y="348" width="220" height="140" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="635" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">Ritmo moderado e sono</text>
  <text x="635" y="399" text-anchor="middle" font-size="13" font-style="italic" fill="#78350f">a verba da obra</text>
  <text x="635" y="431" text-anchor="middle" font-size="13" fill="#1f2937">Déficit pequeno e gradual</text>
  <text x="635" y="451" text-anchor="middle" font-size="13" fill="#1f2937">e noites bem dormidas</text>
  <text x="635" y="471" text-anchor="middle" font-size="13" fill="#1f2937">(o turno da noite)</text>

  <!-- Faixa final -->
  <rect x="55" y="510" width="690" height="50" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="532" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Faltou uma das três? A demolição ganha vantagem.</text>
  <text x="400" y="550" text-anchor="middle" font-size="12" fill="#991b1b">Sinal de alerta: a força cai semana após semana. Reduza o déficit.</text>
</svg>
