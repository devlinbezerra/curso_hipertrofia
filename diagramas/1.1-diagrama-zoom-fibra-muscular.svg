<svg role="img" aria-label="Diagrama do item 1.1: Do músculo ao sarcômero, e a fibra antes e depois de engrossar" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Do músculo ao sarcômero: o "zoom" da hipertrofia</text>

  <!-- Nível 1: Músculo -->
  <rect x="20" y="70" width="190" height="150" rx="10" fill="#fde8e8" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="115" cy="145" rx="75" ry="38" fill="#ef4444" opacity="0.85"/>
  <text x="115" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">1. O músculo</text>
  <text x="115" y="270" text-anchor="middle" font-size="12" fill="#4b5563">(o que você vê no espelho)</text>

  <!-- seta -->
  <text x="228" y="150" text-anchor="middle" font-size="26" fill="#6b7280">→</text>

  <!-- Nível 2: Fibra -->
  <rect x="245" y="70" width="190" height="150" rx="10" fill="#fff4e5" stroke="#c2410c" stroke-width="2"/>
  <g stroke="#ea580c" stroke-width="7" stroke-linecap="round">
    <line x1="265" y1="100" x2="415" y2="100"/>
    <line x1="265" y1="120" x2="415" y2="120"/>
    <line x1="265" y1="140" x2="415" y2="140"/>
    <line x1="265" y1="160" x2="415" y2="160"/>
    <line x1="265" y1="180" x2="415" y2="180"/>
    <line x1="265" y1="200" x2="415" y2="200"/>
  </g>
  <text x="340" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">2. As fibras</text>
  <text x="340" y="270" text-anchor="middle" font-size="12" fill="#4b5563">(células longas, tipo cordas)</text>

  <text x="453" y="150" text-anchor="middle" font-size="26" fill="#6b7280">→</text>

  <!-- Nível 3: Miofibrilas -->
  <rect x="470" y="70" width="190" height="150" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <rect x="490" y="95" width="150" height="100" rx="40" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <g stroke="#b45309" stroke-width="4" stroke-linecap="round">
    <line x1="505" y1="115" x2="625" y2="115"/>
    <line x1="505" y1="130" x2="625" y2="130"/>
    <line x1="505" y1="145" x2="625" y2="145"/>
    <line x1="505" y1="160" x2="625" y2="160"/>
    <line x1="505" y1="175" x2="625" y2="175"/>
  </g>
  <text x="565" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">3. As miofibrilas</text>
  <text x="565" y="270" text-anchor="middle" font-size="12" fill="#4b5563">(os "fios" dentro da fibra)</text>

  <text x="678" y="150" text-anchor="middle" font-size="26" fill="#6b7280">→</text>

  <!-- Nível 4: Sarcômeros -->
  <rect x="695" y="70" width="190" height="150" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <g stroke="#047857" stroke-width="3">
    <line x1="710" y1="95" x2="710" y2="195"/>
    <line x1="790" y1="95" x2="790" y2="195"/>
    <line x1="870" y1="95" x2="870" y2="195"/>
  </g>
  <g stroke="#2563eb" stroke-width="4" stroke-linecap="round">
    <line x1="710" y1="115" x2="765" y2="115"/><line x1="710" y1="145" x2="765" y2="145"/><line x1="710" y1="175" x2="765" y2="175"/>
    <line x1="790" y1="115" x2="845" y2="115"/><line x1="790" y1="145" x2="845" y2="145"/><line x1="790" y1="175" x2="845" y2="175"/>
  </g>
  <g stroke="#dc2626" stroke-width="7" stroke-linecap="round">
    <line x1="735" y1="130" x2="765" y2="130"/><line x1="735" y1="160" x2="765" y2="160"/>
    <line x1="815" y1="130" x2="845" y2="130"/><line x1="815" y1="160" x2="845" y2="160"/>
  </g>
  <text x="790" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">4. Os sarcômeros</text>
  <text x="790" y="270" text-anchor="middle" font-size="12" fill="#4b5563">(os "elos" que encurtam)</text>

  <!-- Divisor -->
  <line x1="20" y1="300" x2="880" y2="300" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Antes / Depois: corte transversal da fibra -->
  <text x="450" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Hipertrofia = a fibra engrossa porque ganha mais "fios" (miofibrilas) por dentro</text>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#4b5563">Corte transversal de uma fibra (como cortar uma corda ao meio e olhar de frente)</text>

  <!-- Antes -->
  <circle cx="240" cy="440" r="75" fill="#fff4e5" stroke="#c2410c" stroke-width="3"/>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
    <circle cx="240" cy="440" r="11"/>
    <circle cx="215" cy="420" r="11"/><circle cx="265" cy="420" r="11"/>
    <circle cx="210" cy="455" r="11"/><circle cx="270" cy="455" r="11"/>
    <circle cx="240" cy="475" r="11"/><circle cx="240" cy="405" r="11"/>
  </g>
  <text x="240" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">ANTES: fibra fina</text>

  <text x="450" y="448" text-anchor="middle" font-size="36" fill="#6b7280">→</text>
  <text x="450" y="475" text-anchor="middle" font-size="12" fill="#4b5563">semanas de treino</text>
  <text x="450" y="491" text-anchor="middle" font-size="12" fill="#4b5563">+ comida + sono</text>

  <!-- Depois -->
  <circle cx="660" cy="440" r="100" fill="#fff4e5" stroke="#c2410c" stroke-width="3"/>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
    <circle cx="660" cy="440" r="11"/>
    <circle cx="635" cy="418" r="11"/><circle cx="685" cy="418" r="11"/>
    <circle cx="630" cy="455" r="11"/><circle cx="690" cy="455" r="11"/>
    <circle cx="660" cy="475" r="11"/><circle cx="660" cy="405" r="11"/>
    <circle cx="610" cy="430" r="11"/><circle cx="710" cy="430" r="11"/>
    <circle cx="612" cy="475" r="11"/><circle cx="708" cy="475" r="11"/>
    <circle cx="635" cy="380" r="11"/><circle cx="685" cy="380" r="11"/>
    <circle cx="635" cy="505" r="11"/><circle cx="685" cy="505" r="11"/>
  </g>
  <text x="660" y="555" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">DEPOIS: fibra grossa (mais miofibrilas)</text>
</svg>
