<svg role="img" aria-label="Diagrama do item 3.2: O músculo corre, o cabo de aço caminha" viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="640" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">O músculo corre, o cabo de aço caminha</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Por que a progressão precisa ser gradual (esquema, sem escala real)</text>

  <!-- painel do gráfico -->
  <rect x="40" y="80" width="720" height="250" rx="10" fill="#f9fafb"/>
  <line x1="90" y1="300" x2="745" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="90" y1="105" x2="90" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="96" y="100" font-size="11" fill="#6b7280">capacidade de aguentar carga</text>
  <text x="745" y="318" text-anchor="end" font-size="11" fill="#6b7280">tempo</text>
  <text x="100" y="318" font-size="11" fill="#6b7280">início</text>
  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#6b7280">semanas</text>
  <text x="520" y="318" text-anchor="middle" font-size="11" fill="#6b7280">meses</text>

  <!-- zona de descompasso -->
  <path d="M100,290 C160,200 250,150 380,135 C500,122 620,120 720,118 L720,150 C640,168 540,202 450,228 C330,262 230,285 100,290 Z" fill="#fde68a" opacity="0.65"/>

  <!-- curvas -->
  <path d="M100,290 C160,200 250,150 380,135 C500,122 620,120 720,118" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M100,290 C230,285 330,262 450,228 C540,202 640,168 720,150" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>

  <text x="470" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Músculo e sistema nervoso: sobem em semanas</text>
  <text x="460" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Zona de descompasso</text>
  <text x="460" y="182" text-anchor="middle" font-size="12" fill="#92400e">força além do que o cabo aguenta</text>
  <text x="620" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Tendões e articulações: sobem em meses</text>

  <!-- zoom -->
  <rect x="40" y="345" width="350" height="92" rx="8" fill="#eff6ff"/>
  <text x="215" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Músculo: canteiro movimentado</text>
  <text x="215" y="391" text-anchor="middle" font-size="12" fill="#1e3a8a">muito sangue chegando, muitos operários,</text>
  <text x="215" y="409" text-anchor="middle" font-size="12" fill="#1e3a8a">demolição e obra em ritmo acelerado</text>

  <rect x="410" y="345" width="350" height="92" rx="8" fill="#f0fdf4"/>
  <text x="585" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Tendão e articulação: canteiro enxuto</text>
  <text x="585" y="391" text-anchor="middle" font-size="12" fill="#14532d">pouco sangue, poucos operários,</text>
  <text x="585" y="409" text-anchor="middle" font-size="12" fill="#14532d">cabo trançado que se reforça devagar</text>

  <!-- exemplos de degrau -->
  <text x="400" y="460" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Teto por degrau: 5 a 10% da carga (exemplos ilustrativos)</text>

  <rect x="40" y="472" width="230" height="92" rx="8" fill="#f3f4f6"/>
  <text x="155" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Agachamento com 100 kg</text>
  <text x="155" y="515" text-anchor="middle" font-size="12" fill="#374151">5% = 5 kg  ·  10% = 10 kg</text>
  <text x="155" y="533" text-anchor="middle" font-size="12" fill="#4b5563">cabe em degraus de anilha,</text>
  <text x="155" y="549" text-anchor="middle" font-size="12" fill="#4b5563">com a execução mantida</text>

  <rect x="285" y="472" width="230" height="92" rx="8" fill="#f3f4f6"/>
  <text x="400" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Supino com 60 kg</text>
  <text x="400" y="515" text-anchor="middle" font-size="12" fill="#374151">5% = 3 kg  ·  10% = 6 kg</text>
  <text x="400" y="533" text-anchor="middle" font-size="12" fill="#4b5563">degraus de 2,5 a 5 kg</text>
  <text x="400" y="549" text-anchor="middle" font-size="12" fill="#4b5563">costumam bastar</text>

  <rect x="530" y="472" width="230" height="92" rx="8" fill="#fef9c3"/>
  <text x="645" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Rosca com 12 kg</text>
  <text x="645" y="515" text-anchor="middle" font-size="12" fill="#713f12">5% = 0,6 kg  ·  10% = 1,2 kg</text>
  <text x="645" y="533" text-anchor="middle" font-size="12" fill="#713f12">próximo halter: +2 kg (≈ 17%)</text>
  <text x="645" y="549" text-anchor="middle" font-size="12" fill="#713f12">use as repetições como ponte</text>

  <!-- rodapé -->
  <rect x="40" y="580" width="720" height="48" rx="8" fill="#fef9c3"/>
  <text x="400" y="600" text-anchor="middle" font-size="13" fill="#713f12">5 a 10% é teto de referência por degrau, não meta: convenção prática, não medida exata.</text>
  <text x="400" y="617" text-anchor="middle" font-size="13" fill="#713f12">Dor localizada na articulação depois de um degrau: não suba mais (item 3.3).</text>
</svg>
