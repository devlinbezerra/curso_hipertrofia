<svg role="img" aria-label="Diagrama do item 1.5: Treino, proteína e sono: ordem, material e turno da noite" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">A obra precisa de três coisas: ordem, material e turno da noite</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#6b7280">Treino dá a ordem de serviço; proteína e sono são o que permitem executá-la</text>

  <!-- Caixa 1: Treino -->
  <rect x="20" y="80" width="190" height="185" rx="12" fill="#fde8e8" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="115" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">1. Treino</text>
  <text x="115" y="126" text-anchor="middle" font-size="12" fill="#991b1b">a ordem de serviço</text>
  <line x1="55" y1="170" x2="175" y2="170" stroke="#7f1d1d" stroke-width="8" stroke-linecap="round"/>
  <rect x="36" y="148" width="20" height="44" rx="4" fill="#374151"/>
  <rect x="174" y="148" width="20" height="44" rx="4" fill="#374151"/>
  <text x="115" y="222" text-anchor="middle" font-size="12" fill="#1f2937">Tensão perto do limite,</text>
  <text x="115" y="240" text-anchor="middle" font-size="12" fill="#1f2937">volume e progressão</text>
  <text x="115" y="256" text-anchor="middle" font-size="11" fill="#6b7280">(itens 1.2 a 1.4)</text>

  <text x="228" y="178" text-anchor="middle" font-size="26" fill="#6b7280">+</text>

  <!-- Caixa 2: Proteína -->
  <rect x="245" y="80" width="190" height="185" rx="12" fill="#fff4e5" stroke="#c2410c" stroke-width="2.5"/>
  <text x="340" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">2. Proteína</text>
  <text x="340" y="126" text-anchor="middle" font-size="12" fill="#9a3412">os tijolos da obra</text>
  <!-- colar de contas -->
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1.5">
    <circle cx="275" cy="160" r="9"/><circle cx="295" cy="150" r="9"/><circle cx="315" cy="160" r="9"/><circle cx="335" cy="150" r="9"/><circle cx="355" cy="160" r="9"/><circle cx="375" cy="150" r="9"/><circle cx="395" cy="160" r="9"/>
  </g>
  <path d="M275 160 L295 150 L315 160 L335 150 L355 160 L375 150 L395 160" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="335" y="190" text-anchor="middle" font-size="11" fill="#4b5563">comida vira "contas soltas"</text>
  <text x="335" y="205" text-anchor="middle" font-size="11" fill="#4b5563">(aminoácidos) que a fibra</text>
  <text x="335" y="220" text-anchor="middle" font-size="11" fill="#4b5563">remonta em estrutura nova</text>
  <text x="340" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">cerca de 1,6 a 2,2 g/kg/dia</text>

  <text x="453" y="178" text-anchor="middle" font-size="26" fill="#6b7280">+</text>

  <!-- Caixa 3: Sono -->
  <rect x="470" y="80" width="190" height="185" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="565" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#3730a3">3. Sono</text>
  <text x="565" y="126" text-anchor="middle" font-size="12" fill="#3730a3">o turno da noite</text>
  <circle cx="565" cy="165" r="25" fill="#fbbf24"/>
  <circle cx="577" cy="157" r="22" fill="#eef2ff"/>
  <text x="565" y="215" text-anchor="middle" font-size="12" fill="#1f2937">É quando boa parte da</text>
  <text x="565" y="231" text-anchor="middle" font-size="12" fill="#1f2937">reconstrução e da recuperação</text>
  <text x="565" y="247" text-anchor="middle" font-size="12" fill="#1f2937">acontece, sem interrupção</text>
  <text x="565" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">em geral 7 a 9 h</text>

  <text x="678" y="178" text-anchor="middle" font-size="26" fill="#6b7280">→</text>

  <!-- Caixa 4: Resultado -->
  <rect x="695" y="80" width="190" height="185" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="790" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#065f46">4. Fibra mais grossa</text>
  <text x="790" y="126" text-anchor="middle" font-size="12" fill="#065f46">obra entregue</text>
  <circle cx="790" cy="178" r="42" fill="#fff4e5" stroke="#c2410c" stroke-width="2"/>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="1">
    <circle cx="790" cy="178" r="7"/><circle cx="772" cy="165" r="7"/><circle cx="808" cy="165" r="7"/><circle cx="770" cy="192" r="7"/><circle cx="810" cy="192" r="7"/><circle cx="790" cy="205" r="7"/><circle cx="790" cy="152" r="7"/>
  </g>
  <text x="790" y="238" text-anchor="middle" font-size="12" fill="#1f2937">Mais miofibrilas por fibra</text>
  <text x="790" y="254" text-anchor="middle" font-size="11" fill="#6b7280">(item 1.1)</text>

  <!-- Painéis inferiores: o que acontece se faltar -->
  <text x="450" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">E se um dos dois faltar?</text>

  <rect x="20" y="320" width="425" height="150" rx="10" fill="#fff4e5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="232" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Pouca proteína</text>
  <text x="232" y="372" text-anchor="middle" font-size="12" fill="#1f2937">A ordem de serviço é emitida, mas faltam tijolos.</text>
  <text x="232" y="392" text-anchor="middle" font-size="12" fill="#1f2937">A construção não acompanha e a demolição ganha,</text>
  <text x="232" y="412" text-anchor="middle" font-size="12" fill="#1f2937">especialmente em déficit calórico (bloco 4).</text>
  <text x="232" y="445" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">Treino sem material = esforço desperdiçado</text>

  <rect x="455" y="320" width="425" height="150" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="667" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Pouco sono</text>
  <text x="667" y="372" text-anchor="middle" font-size="12" fill="#1f2937">A equipe de obras trabalha devagar e o treino</text>
  <text x="667" y="392" text-anchor="middle" font-size="12" fill="#1f2937">seguinte rende pior (séries duras de menos qualidade).</text>
  <text x="667" y="412" text-anchor="middle" font-size="12" fill="#1f2937">Em dieta, tende a piorar a composição do que se perde.</text>
  <text x="667" y="445" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">Treino sem recuperação = fadiga acumulada</text>

  <rect x="20" y="490" width="860" height="48" rx="10" fill="#1f2937"/>
  <text x="450" y="520" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Sem material e sem turno da noite, a ordem de serviço fica parada.</text>
</svg>
