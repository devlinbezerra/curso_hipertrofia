<svg role="img" aria-label="Diagrama do item 4.4: Para onde vai a caloria extra: portinhas e usinas da fibra" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Para onde vai a caloria extra</text>
  <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6b7280">Quatro destinos e dois reguladores dentro da fibra (esquema, sem escala real)</text>

  <!-- Painel 1 -->
  <rect x="40" y="80" width="720" height="235" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- Caixa de origem -->
  <rect x="60" y="165" width="150" height="70" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="135" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#312e81">Caloria extra</text>
  <text x="135" y="216" text-anchor="middle" font-size="12" fill="#312e81">(comida a mais)</text>

  <!-- Setas -->
  <line x1="210" y1="200" x2="440" y2="122" stroke="#6b7280" stroke-width="2"/>
  <line x1="210" y1="200" x2="440" y2="172" stroke="#6b7280" stroke-width="2"/>
  <line x1="210" y1="200" x2="440" y2="222" stroke="#6b7280" stroke-width="2"/>
  <line x1="210" y1="200" x2="440" y2="272" stroke="#6b7280" stroke-width="2"/>

  <!-- Destinos -->
  <rect x="440" y="102" width="300" height="40" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="455" y="127" font-size="14" fill="#1e3a8a"><tspan font-weight="bold">Músculo:</tspan> a obra assenta tijolos</text>

  <rect x="440" y="152" width="300" height="40" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <text x="455" y="177" font-size="14" fill="#374151"><tspan font-weight="bold">Estoque:</tspan> glicogênio e água</text>

  <rect x="440" y="202" width="300" height="40" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="455" y="227" font-size="14" fill="#14532d"><tspan font-weight="bold">Queimada:</tspan> movimento e usinas</text>

  <rect x="440" y="252" width="300" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="455" y="277" font-size="14" fill="#78350f"><tspan font-weight="bold">Gordura:</tspan> o depósito</text>

  <text x="135" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">A divisão</text>
  <text x="135" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">não é fixa</text>

  <!-- Painel 2 -->
  <rect x="40" y="335" width="720" height="250" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Zoom numa fibra: portinhas e usinas</text>

  <!-- Seta sinais -->
  <text x="260" y="392" text-anchor="middle" font-size="12" fill="#1e3a8a">insulina e treino levam as portinhas à parede</text>

  <!-- Fibra -->
  <rect x="60" y="415" width="400" height="140" rx="50" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>

  <!-- Portinhas -->
  <rect x="105" y="408" width="16" height="14" fill="#1d4ed8"/>
  <rect x="165" y="408" width="16" height="14" fill="#1d4ed8"/>
  <rect x="225" y="408" width="16" height="14" fill="#1d4ed8"/>
  <rect x="285" y="408" width="16" height="14" fill="#1d4ed8"/>
  <rect x="345" y="408" width="16" height="14" fill="#1d4ed8"/>
  <rect x="405" y="408" width="16" height="14" fill="#1d4ed8"/>

  <!-- Usinas -->
  <ellipse cx="135" cy="485" rx="26" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="215" cy="520" rx="26" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="290" cy="470" rx="26" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="365" cy="520" rx="26" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="415" cy="480" rx="26" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

  <!-- Legenda -->
  <rect x="490" y="395" width="16" height="14" fill="#1d4ed8"/>
  <text x="514" y="408" font-size="13" font-weight="bold" fill="#1e3a8a">Portinhas</text>
  <text x="490" y="428" font-size="12" fill="#374151">deixam a glicose entrar.</text>
  <text x="490" y="445" font-size="12" fill="#374151">Boa sensibilidade à insulina:</text>
  <text x="490" y="462" font-size="12" fill="#374151">poucas ordens, muitas portas.</text>

  <ellipse cx="498" cy="492" rx="9" ry="6" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="514" y="497" font-size="13" font-weight="bold" fill="#78350f">Usinas (mitocôndrias)</text>
  <text x="490" y="517" font-size="12" fill="#374151">queimam gordura e açúcar.</text>
  <text x="490" y="534" font-size="12" fill="#374151">Mais usinas e mais preparo:</text>
  <text x="490" y="551" font-size="12" fill="#374151">menos sobra para o depósito.</text>
</svg>
